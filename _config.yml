zotero_username: # your zotero username

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------
# Custom content types that generate their own pages and directories.
# Each collection maps to a folder under the project root prefixed with "_".
# Example: "_news", "_team", "_research", etc.
#
# `output: true` enables HTML page generation for each item in the collection.
# `permalink` defines the URL structure for the generated pages.
# `defaults.layout` sets the layout template used when rendering items.
#
# Adjust these if adding/removing content types or changing URL conventions.
collections:
  news:
    defaults:
      layout: post
    output: true
    permalink: /:collection/:title/
  team:
    defaults:
      layout: team_member
    output: true
    permalink: /:collection/:name/
  research:
    output: true
    permalink: /:collection/:title/
  teaching:
    output: true
    permalink: /:collection/:title/
  pics:
    output: true
    permalink: /:collection/:title/

announcements:
  enabled: true
  scrollable: true # adds a vertical scroll bar if there are more than 3 news items
  limit: 5 # leave blank to include all the news in the `_news` folder

latest_posts:
  enabled: true
  scrollable: true # adds a vertical scroll bar if there are more than 3 new posts items
  limit: 3 # leave blank to include all the blog posts

# -----------------------------------------------------------------------------
# Blog
# -----------------------------------------------------------------------------

permalink: /blog/:year/:title/
lsi: false # produce an index for related posts

# Pagination
pagination:
  enabled: true
  title: ":title - pagination.page :num"

related_blog_posts:
  enabled: true
  max_related: 5

# -----------------------------------------------------------------------------
# Newsletter
# -----------------------------------------------------------------------------

newsletter:
  enabled: false
  endpoint: # your loops endpoint (e.g., https://app.loops.so/api/newsletter-form/YOUR-ENDPOINT)
  # https://loops.so/docs/forms/custom-form

# -----------------------------------------------------------------------------
# Jekyll Polyglot — Multilingual Support
# -----------------------------------------------------------------------------
# Configuration for managing translated versions of the website.
languages: ["en-gb", "es-es"] # List of supported language–region codes (BCP 47), e.g., "en-gb" = English (United Kingdom), "es-es" = Spanish (Spain)
default_lang: "en-gb" # sets the primary language used when no locale is specified.
exclude_from_localization: ["assets"] # prevents certain folders/files from being duplicated for each language during the build process (e.g., shared static assets).
lang_from_path: true # enables automatic language detection from the URL path. Example: /es-es/ will serve Spanish content.
country_flag: true # enables country flags in the language switcher. Disable if flags are not desired or if languages span multiple countries.
parallel_localization: false # forces missing pages to fall back to the default language instead of creating placeholder pages in other languages.

# -----------------------------------------------------------------------------
# Responsive WebP Images
# -----------------------------------------------------------------------------

# MAKE SURE imagemagick is installed and on your PATH before enabling imagemagick. In a terminal, run:
#   convert -version
# Automatically generates resized WebP versions of images from the specified input directories, improving performance on modern browsers.
imagemagick:
  enabled: true # enables responsive images for your site (recommended, see https://github.com/alshedivat/al-folio/issues/537)
  regenerate_existing: false # set to true to regenerate existing images (otherwise, only new images are processed)
  widths: # list of responsive breakpoints to generate (in pixels).
    - 480
    - 800
    - 1400
  input_directories: # folders monitored for source images
    - assets/img/
  input_formats: # image file types to convert
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".tiff"
    - ".gif"
  output_formats: # conversion settings passed to ImageMagick
    webp: "-quality 85"

# Lazy loading images
#   If you enable lazy loading, all images will add the loading="lazy" attribute.
#   This will make your site load faster, but it may not be supported in all browsers.
#   You can also set loading="" to other values for specific images to override the default behavior.
#   Options: "auto", "eager", "lazy"
#   See https://web.dev/browser-level-image-lazy-loading/ for more information.
lazy_loading_images: true # enables lazy loading of images (recommended)

# -----------------------------------------------------------------------------
# Jekyll Scholar
# -----------------------------------------------------------------------------

scholar:
  last_name: [Reyes]
  first_name: [Alejandro]

  style: apa
  locale: en

  source: /_bibliography/
  bibliography: bcem.bib
  bibliography_template: bib
  # Note: if you have latex math in your bibtex, the latex filter
  # preprocessing may conflict with MathJAX if the latter is enabled.
  # See https://github.com/alshedivat/al-folio/issues/357.
  bibtex_filters: [latex, smallcaps, superscript]

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_link: Details

  query: "@*"
  group_by: year
  group_order: descending

# Display different badges withs stats for your publications
enable_publication_badges:
  altmetric: true # Altmetric badge (https://www.altmetric.com/products/altmetric-badges/)
  dimensions: true # Dimensions badge (https://badge.dimensions.ai/)
  google_scholar: true # Google Scholar badge (https://scholar.google.com/intl/en/scholar/citations.html)

# Filter out certain bibtex entry keywords used internally from the bib output
filtered_bibtex_keywords:
  [
    abbr,
    abstract,
    additional_info,
    altmetric,
    annotation,
    arxiv,
    award,
    award_name,
    bibtex_show,
    blog,
    code,
    html,
    pdf,
    poster,
    preview,
    selected,
    slides,
    supp,
    video,
    website,
  ]

# Maximum number of authors to be shown for each publication (more authors are visible on click)
max_author_limit: 3 # leave blank to always show all authors
more_authors_animation_delay: 10 # more authors are revealed on click using animation; smaller delay means faster animation

# Enables publication thumbnails. If disabled, none of the publications will display thumbnails, even if specified in the bib entry.
enable_publication_thumbnails: false

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------
# Markdown and syntax highlight
markdown: kramdown # Jekyll supports multiple Markdown processors; here we explicitly use Kramdown.
highlighter: rouge # Rouge is the syntax highlighter used for code blocks within Markdown files.
kramdown:
  input: GFM # Use GitHub-Flavored Markdown (GFM) so formatting is consistent with GitHub.
  syntax_highlighter_opts:
    css_class: "highlight" # Adds a CSS class to code blocks for styling consistency with the theme.
    span:
      line_numbers: false # true = show line numbers inline for inline code; false = hide (default).
    block:
      line_numbers: false # true = show line numbers for fenced code blocks; false recommended unless needed globally.
      start_line: 1 # Starting line number when line_numbers=true (useful for documentation/tutorials).

# Includes & excludes
# This section controls which files and folders Jekyll processes or skips when generating your site.
include: # Paths that should always be included in the build even if normally ignored.
  - _pages # `_pages` is processed to support custom page routing.
exclude: # Files and folders to exclude from the build. These are not copied to the final `_site` directory, reducing clutter and build time.
  - bin/ # Development scripts/tools
  - CONTRIBUTING.md # Developer guidelines (not part of site output)
  - CUSTOMIZE.md # Theme customization documentation
  - Dockerfile # Docker setup files
  - docker-compose.yml
  - docker-compose-slim.yml
  - FAQ.md # Internal docs not displayed on site
  - Gemfile # Jekyll dependency definitions
  - Gemfile.lock # Locked gem versions
  - INSTALL.md # Setup instructions
  - LICENSE # Theme software license (optional for publishing)
  - lighthouse_results/ # Performance testing reports
  - package.json # Node dependencies (development only)
  - package-lock.json
  - purgecss.config.js # CSS optimization config
  - README.md # Only for GitHub repo, not site output
  - readme_preview/ # Preview resources not used in production
  - UPGRADING.md # Upgrade notes for theme maintainers
  - vendor # Bundled Ruby dependencies folder
  # Content templates — excluded to prevent publishing placeholders
  - _pages/page_template.md
  - _news/announcement_template.md
  - _research/topic_template.md
  - _teaching/course_template.md
  - _team/member_template.md
  - _pics/post_template.md
# Files that should remain at the root of the published site.
keep_files:
  - CNAME # Required for custom domain ownership
  - .nojekyll # Prevent GitHub Pages from treating this as a standard Jekyll site

# -----------------------------------------------------------------------------
# Plug-ins
# -----------------------------------------------------------------------------
# Extend Jekyll functionality. Ensure all plugins are supported by GitHub Pages or deployed via custom CI, as some may not be natively supported.
plugins:
  - jekyll-archives # generates archive pages (tags/categories)
  - jekyll-email-protect # obfuscates email addresses to reduce spam
  - jekyll-feed # creates a valid RSS/Atom feed
  - jekyll-get-json # imports JSON data into your site
  - jekyll-imagemagick # responsive image optimization (WebP)
  - jekyll-jupyter-notebook # render Jupyter notebooks as HTML content
  - jekyll-link-attributes # automatically add attributes to external links
  - jekyll-minifier # HTML/CSS/JS minification for faster load times
  - jekyll-paginate-v2 # advanced pagination support
  - jekyll-polyglot # multilingual site generation
  - jekyll-regex-replace # regex-based content transformations
  - jekyll/scholar # bibliographic and citation support
  - jekyll-sitemap # auto-generated sitemap for SEO
  - jekyll-tabs # tabbed content blocks
  - jekyll-toc # auto table of contents generation
  - jekyll-twitter-plugin # embeds Twitter/X posts
  - jemoji # emoji support in Markdown

# -----------------------------------------------------------------------------
# Sitemap Settings
# -----------------------------------------------------------------------------
# Exclude certain files (such as static assets) from sitemap generation.
defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false

# -----------------------------------------------------------------------------
# Sass
# -----------------------------------------------------------------------------
# Controls CSS preprocessing and output formatting.
sass:
  sourcemap: never # no source maps in production for smaller file size
  style: compressed # minified CSS for faster page loads

# -----------------------------------------------------------------------------
# Jekyll Link Attributes
# -----------------------------------------------------------------------------
# Automatically applies attributes to external links for better UX and security.
# rel:
#   - 'noopener' prevents newly opened tabs from accessing `window.opener`
#   - 'nofollow' discourages search engines from ranking linked pages
# target:
#   - '_blank' opens external links in a new tab
external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
  exclude:

# -----------------------------------------------------------------------------
# Optional Features
# -----------------------------------------------------------------------------
enable_google_analytics: false # enables google analytics
enable_cronitor_analytics: false # enables cronitor RUM analytics
enable_pirsch_analytics: false # enables Pirsch analytics (https://pirsch.io/)
enable_google_verification: false # enables google site verification
enable_bing_verification: false # enables bing site verification
enable_masonry: true # enables automatic project cards arrangement
enable_math: true # enables math typesetting (uses MathJax)
enable_tooltips: false # enables automatic tooltip links generated for each section titles on pages and posts
enable_darkmode: true # enables switching between light/dark modes
enable_navbar_social: false # enables displaying social links in the navbar on the about page
enable_project_categories: true # enables categorization of projects into multiple categories
enable_medium_zoom: true # enables image zoom feature (as on medium.com)
enable_progressbar: true # enables a horizontal progress bar linked to the vertical scroll position
enable_video_embedding: false # enables video embedding for bibtex entries. If false, the button opens the video link in a new window.

