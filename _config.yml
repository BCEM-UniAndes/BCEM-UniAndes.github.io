jekyll_get_json:
  - data: resume_en-gb
    json: assets/json/resume_en-gb.json # it can also be an url
  - data: resume_es-es
    json: assets/json/resume_es-es.json # it can also be an url
jsonresume:
  - basics
  - work
  - education
  - publications
  - projects
  - volunteer
  - awards
  - certificates
  - skills
  - languages
  - interests
  - references
