# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title: "BCEM" # Short site title (used in header and footer)
title_long: "Computational Biology and Microbial Ecology Lab" # Full title shown in Home page (if enebled)
affiliation: Universidad de los Andes # Affiliation (shown in Home page if enabled)
affiliation_short: Uniandes # Shortened affiliation (shown in header and footer)
country: co # ISO 3166-1 alpha-2 country code used for metadata and flag display (e.g., "co" for Colombia)
icon:
  head: bcem_logo.png # Favicon or logo displayed in the browser tab. File should be at assets/img/logopic
  navbar:
    show_home: false # If false, hide home button in navbar when on About (Home) page
    group_logo: bcem_logo_nt.png # Logo used in the navbar and on the landing page. File should be at assets/img/logopic
    include_title: true # set to true to include the title next to the logo in the navbar
    affiliation_logo: uniandes_logo.png # the logo of your affiliation (e.g., university, company, etc.) shown in the navbar. File should be at assets/img/logopic

url: https://BCEM-UniAndes.github.io # the base hostname & protocol for your site
baseurl: # the subpath of your site, e.g. /blog/. Leave blank for root
publication_year: 2024 # # Start year shown in footer © notice
last_updated: true # Show "Last updated: <date>" in footer
impressum_path: # set to path to include impressum link in the footer, use the same path as permalink in a page, helps to conform with EU GDPR. # Optional legal notice link (useful for GDPR, leave empty in Colombia)
back_to_top: true # Enables bottom-right "scroll back to top" button
keywords: # SEO keywords for search engines
  - multilingual-website
  - academic-website
  - BCEM
  - Uniandes
  - Microbial Ecology
  - Computational Biology
  - Microbiome research in Latinamerica
  - Microbioma
  - Ecologia microbiana
  - Biologia Computacional
  - Microbiologia

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

navbar_fixed: true # If true, the navigation bar in the header will be fixed
home_page_in_navbar: false # If true, the home page will be an option in the navigation bar
footer_fixed: true # If true, the footer will be fixed
search_enabled: true # If true, browsing capabilities within the website will be available
socials_in_search: true # If true, social nformation will be available in the serching

# Dimensions
max_width: 1200px # Maximum width of the website in a browser

# -----------------------------------------------------------------------------
# Social integration
# -----------------------------------------------------------------------------

email: a.reyes@uniandes.edu.co # your email address
acm_id: # your dl.acm.org/profile/id
blogger_url: # your blogger URL
bluesky_url: # your bluesky URL
dblp_url: # your DBLP profile url
discord_id: # your discord id (18-digit unique numerical identifier)
